<div class="bg-background min-h-screen flex flex-col font-sans text-on-surface antialiased">
  <main class="flex-grow p-4 md:p-8">
    <div class="w-full max-w-3xl mx-auto">
      <div class="mb-6 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
        <div>
          <h1 class="text-2xl font-bold text-on-surface tracking-tight mb-1">
            Acompanhamento da Carga Horária
          </h1>
          <p class="text-sm text-on-surface-variant">
            Progresso das suas atividades complementares
          </p>
        </div>
        <a
          routerLink="/atividades/cadastro"
          class="inline-flex items-center gap-2 px-4 py-2 bg-primary-container text-white text-xs font-semibold rounded-lg hover:bg-primary transition-colors self-start sm:self-auto"
        >
          <span>+ Cadastrar Atividade</span>
        </a>
      </div>

      @if (carregando()) {
        <app-loading-spinner message="Carregando seu progresso..."></app-loading-spinner>
      } @else if (mensagemErro()) {
        <div
          role="alert"
          class="mb-6 p-4 bg-error-container text-on-error-container rounded-lg flex items-start gap-3 border border-error/20 text-sm"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="w-5 h-5 shrink-0 text-error mt-0.5"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="2"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"
            />
          </svg>
          <p>{{ mensagemErro() }}</p>
        </div>
      } @else {
        @if (semAtividades()) {
          <app-empty-state
            mensagem="Você ainda não possui atividades registradas. Clique em 'Cadastrar Atividade' para iniciar."
          ></app-empty-state>
        }

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          @for (card of cards(); track card.titulo) {
            <app-progresso-card
              [titulo]="card.titulo"
              [descricao]="card.descricao"
              [dados]="card.dados"
            ></app-progresso-card>
          }
        </div>
      }
    </div>
  </main>
</div>
